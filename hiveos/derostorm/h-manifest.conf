# HiveOS custom miner manifest for DeroStorm.
#
# CUSTOM_NAME must match the directory this file sits in, and the flight sheet's
# "Miner name" field. CUSTOM_BUILD is the packaging revision: bump it when this
# wrapper changes and CUSTOM_VERSION when the miner does, because HiveOS
# reinstalls on a change to either.
CUSTOM_NAME=derostorm
CUSTOM_VERSION=1.7.1
CUSTOM_BUILD=1

# Written by h-config.sh, read by h-run.sh. It is a shell fragment rather than
# the miner's own derostorm.json, because a flight sheet's "Extra config
# arguments" box is command-line shaped and translating it into JSON would only
# take options away.
CUSTOM_CONFIG_FILENAME=derostorm.conf

# HiveOS appends .log and rotates it.
CUSTOM_LOG_BASENAME=/var/log/miner/derostorm/derostorm
